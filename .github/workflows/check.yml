name: Проверка переносимости
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run setup
      - run: npm test
      - run: npm --prefix frontend run lint
      - run: npm run demo
      - run: npm run smoke
